name: Fetch IMD data and deploy site
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: live
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-dotenv
      - run: python fetch_imd.py
        env:
          IMD_API_KEY: ${{ secrets.IMD_API_KEY }}
          IMD_EMAIL: ${{ secrets.IMD_EMAIL }}
          IMD_PASSWORD: ${{ secrets.IMD_PASSWORD }}
      - name: Keep history.json for the next run
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f web/history.json web/live.json
          git diff --cached --quiet || (git commit -m "live data" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
